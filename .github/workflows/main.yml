name: Update Profile

concurrency:
  group: profile-update
  cancel-in-progress: true

permissions:
  contents: write

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

jobs:
  generate-profile-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate stats card
        uses: coff33ninja/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=github_dark&hide_border=true
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: coff33ninja/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=github_dark&hide_border=true
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card - ai-skills
        uses: coff33ninja/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=ai-skills&theme=github_dark&hide_border=true
          path: dist/pin-ai-skills.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card - ai-memory
        uses: coff33ninja/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=ai-memory&theme=github_dark&hide_border=true
          path: dist/pin-ai-memory.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card - go-mcp-computer-use
        uses: coff33ninja/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=go-mcp-computer-use&theme=github_dark&hide_border=true
          path: dist/pin-go-mcp-computer-use.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card - mcp-system-cleanup
        uses: coff33ninja/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=mcp-system-cleanup&theme=github_dark&hide_border=true
          path: dist/pin-mcp-system-cleanup.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card - JARVIS_SYSTEM
        uses: coff33ninja/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=JARVIS_SYSTEM&theme=github_dark&hide_border=true
          path: dist/pin-JARVIS_SYSTEM.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card - My_Cam
        uses: coff33ninja/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=My_Cam&theme=github_dark&hide_border=true
          path: dist/pin-My_Cam.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Checkout trophy fork
        uses: actions/checkout@v4
        with:
          repository: coff33ninja/github-profile-trophy
          path: trophy

      - name: Generate trophy
        shell: bash
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API: https://api.github.com/graphql
        run: deno run --allow-net --allow-env --allow-read --allow-write ./scripts/render_trophy.ts ${{ github.repository_owner }} ./dist/trophy.svg onedark

      - name: Generate pin cards for top repos
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT_1: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node ./scripts/generate_top_pin_cards.mjs

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: generate-profile-assets

    steps:
      - uses: actions/checkout@v4

      - name: Update README recent projects
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECENT_PROJECTS_USER: ${{ github.repository_owner }}
          RECENT_PROJECTS_COUNT: 10
        run: ./scripts/update_recent_projects.ps1

      - name: Update README with recent activity
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECENT_PROJECTS_USER: ${{ github.repository_owner }}
          RECENT_PROJECTS_COUNT: 10
        run: ./scripts/update_recent_activity.ps1

      - name: Commit changes
        shell: bash
        run: |
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update profile assets and README"
          git push
# workflow version 2
